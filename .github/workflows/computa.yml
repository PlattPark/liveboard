name: Computa

# HOW THIS RUNS
#   GitHub throttles 5-minute crons on free repos to a run every few hours,
#   which the crew noticed on day two. So instead: each run polls Slack every
#   90 seconds for ~5.5 hours, then hands off to the next run. Four runs a
#   day, continuous coverage, 90-second replies.
#
#   The handoff needs a token that can fire repository_dispatch - the
#   Actions-provided GITHUB_TOKEN is not allowed to start new runs. Secret
#   GH_PAT = the computa-liveboard fine-grained token (Contents write is enough).
#   Without GH_PAT the run still does its 5.5 hours; the cron backup restarts
#   it within a few hours. With it, the chain never breaks.
#
#   Concurrency keeps one run at a time and one queued; a cron backup that
#   fires mid-chain is simply cancelled by the next handoff, so there is
#   never a second chain.

on:
  repository_dispatch:
    types: [computa-next]        # the handoff
  schedule:
    - cron: "*/5 * * * *"        # backup only - throttled by GitHub to every few hours
  workflow_dispatch:             # "Run workflow" button
    inputs:
      minutes:
        description: "How long this run polls before handing off (default 330 = ~5.5h; use 2 to test the handoff)"
        default: "330"

permissions:
  contents: write

concurrency:
  group: computa
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355         # GitHub's cap is 360
    steps:
      - uses: actions/checkout@v4

      - name: Poll Slack every 30s for ~5.5 hours
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}        # the smart read; empty = patterns only
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}    # 86 -> register / gatesdeli.com / DoorDash; empty = off
          SPOTHOPPER_EMAIL: ${{ secrets.SPOTHOPPER_EMAIL }}          # website beer list; empty = off
          SPOTHOPPER_PASSWORD: ${{ secrets.SPOTHOPPER_PASSWORD }}
          MENU_PRICES: report                                        # QR menu prices vs register: report to #board; "apply" writes them
        run: |
          git config user.name  "computa"
          git config user.email "computa@plattparkbrewing.com"
          persist() {
            for f in computa_state.json computa_queue.json computa_health.json menu.html menu_state.json; do
              [ -f "$f" ] && git add "$f"
            done
            git diff --cached --quiet && return 0
            git commit -qm "computa: state"
            git pull -q --rebase --autostash origin main
            git push -q
          }
          MIN="${{ github.event.inputs.minutes }}"; MIN="${MIN:-330}"
          echo "polling for $MIN minutes"
          END=$(( $(date +%s) + MIN*60 ))
          n=0
          while [ "$(date +%s)" -lt "$END" ]; do
            n=$((n+1))
            echo "--- cycle $n $(date -u +%H:%M:%S) ---"
            python3 computa.py || echo "cycle failed - continuing"
            git pull -q --rebase --autostash origin main || echo "pull failed - continuing"   # fresh code + beers.json every cycle
            python3 tools/menu_build.py || echo "menu build failed - continuing"            # QR menu follows the wall and the register
            persist || echo "persist failed - continuing"
            sleep 30
          done
          echo "loop done after $n cycles"

      - name: Hand off to the next run
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "no GH_PAT secret - relying on the cron backup to restart"; exit 0
          fi
          # three tries, 30s apart - a single GitHub hiccup must not break the chain
          for try in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/PlattPark/liveboard/dispatches \
              -d '{"event_type":"computa-next"}')
            echo "dispatch try $try -> HTTP $code"
            [ "$code" = "204" ] && exit 0
            sleep 30
          done
          echo "handoff failed 3x - the cron backup will restart the chain"
          # say so out loud: a refused token is invisible otherwise (Oct 2026: GH_PAT expired and nobody knew for days)
          msg=":warning: Computa's relay token was refused (HTTP $code). It keeps running on GitHub's backup schedule, but replies can lag by hours until it's renewed. Christian: please text Colby - the GH_PAT token needs renewing."
          for ch in C0CALA09Z35 U0AQDQ7JH5G; do
            curl -sS -o /dev/null -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" -H "Content-Type: application/json; charset=utf-8" \
              -d "{\"channel\":\"$ch\",\"text\":\"$msg\"}" || true
          done
